services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./deploy/worker.env
        format: raw
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
